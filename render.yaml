databases:
  - name: imperium-db
    plan: free
    databaseName: imperium
    user: imperium

services:
  - type: web
    name: imperium-esports
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /salud
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: imperium-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: SITE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: NOTIFY_WEBHOOK_URL
        sync: false
